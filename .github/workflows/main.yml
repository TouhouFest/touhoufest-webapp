name: Deploy with Github Actions
on: 
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  Web-Deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Pull down repository 
        uses: actions/checkout@v4
      - run: cd ${{ github.workspace }}
      - run: npm install
      - name: Pull down events from Google Sheets
        run: curl --output src/events.csv ""$SUPER_SECRET""
        env:
          SUPER_SECRET: ${{ secrets.GOOGLE_SHEETS_URL }}
      - name: Unlock secrets
        uses: sliteteam/github-action-git-crypt-unlock@1.2.0
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
      - uses: flydiverny/setup-git-crypt@v4
      - uses: stefanzweifel/git-auto-commit-action@v5
      - name: Deploy with gh-pages
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          npm run deploy -- -u "github-actions-bot <support+actions@github.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    
  Android-Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull down repository 
        uses: actions/checkout@v4
      - run: cd ${{ github.workspace }}
      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '23'
          cache: gradle
      - name: Unlock secrets
        uses: sliteteam/github-action-git-crypt-unlock@1.2.0
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
      - run: npm install
      - name: Pull down events from Google Sheets
        run: curl --output src/events.csv ""$SUPER_SECRET""
        env:
          SUPER_SECRET: ${{ secrets.GOOGLE_SHEETS_URL }}
      - uses: flydiverny/setup-git-crypt@v4
      - uses: stefanzweifel/git-auto-commit-action@v5
      - run: npm run build
      - run: npx cap build android
        
