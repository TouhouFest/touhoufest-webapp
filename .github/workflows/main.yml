name: Deploy with Github Actions
on: 
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  Web-Deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # pull down repository and new events
      - name: Pull down repository 
        uses: actions/checkout@v4
      - run: cd ${{ github.workspace }}
      - run: npm ci
      - run: npm test
      # unlock repository using git crypt secrets
      - uses: flydiverny/setup-git-crypt@v4
      - run:  echo ""$GIT_CRYPT_KEY"" | base64 -di --decode > ~/key && git-crypt unlock ~/key && rm ~/key
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
      - name: Pull down events from Google Sheets
        run: curl --output src/events.csv ""$SUPER_SECRET""
        env:
          SUPER_SECRET: ${{ secrets.GOOGLE_SHEETS_URL }}
      # commit new events and deploy to website
      - uses: stefanzweifel/git-auto-commit-action@v5
      - name: Deploy with gh-pages
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          npm run deploy -- -u "github-actions-bot <support+actions@github.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    
  Android-Deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [Web-Deploy]
    steps:
      # pull down repository
      - name: Pull down repository 
        uses: actions/checkout@v4
      - run: cd ${{ github.workspace }}
      - run: git pull
      # set up java and gradle
      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
      # use this webpage to match-up java versions and gradle versions
      # https://docs.gradle.org/current/userguide/compatibility.html
      - name: Gradle Setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      # - run: alias gradle='/home/runner/work/_temp/.gradle-actions/gradle-installations/installs/gradle-8.10/bin/gradle'
      # install npm dependencies
      - run: npm ci 
      # unlock repository using git crypt secrets
      - uses: flydiverny/setup-git-crypt@v4
      - run:  echo ""$GIT_CRYPT_KEY"" | base64 -di --decode > ~/key && git-crypt unlock ~/key
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
      # refresh build for android, commit
      - run: npx capacitor-set-version -v ""$GITHUB_RUN_NUMBER"" -b ""$GITHUB_RUN_NUMBER""
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - run: npm run build
      - run: npm test
      - run: npx cap sync android
      - uses: stefanzweifel/git-auto-commit-action@v5
      # build app and publish as artifact
      - run: npx cap build android --androidreleasetype AAB
      - run: npx cap build android --androidreleasetype APK
      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-files
          path: /home/runner/work/touhoufest-webapp/touhoufest-webapp/android/app/build/outputs/bundle/release/
      - name: Upload app to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          packageName: com.touhoufest.touhoufestwebapp
          releaseFiles: /home/runner/work/touhoufest-webapp/touhoufest-webapp/android/app/build/outputs/bundle/release/app-release-signed.aab
          track: alpha
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          releaseName: ${{github.run_number}}
  IOS-Deploy:
    permissions:
      contents: write
    runs-on: macos-latest
    needs: [Android-Deploy]
    steps:
      #pull down repository
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: Pull down repository 
        uses: actions/checkout@v4
      - run: cd ${{ github.workspace }}
      - run: git pull
      - run: npm ci
      # unlock repository using git crypt secrets
      # - uses: flydiverny/setup-git-crypt@v4
      - run: brew install git-crypt
      - run:  echo ""$GIT_CRYPT_KEY"" | base64 -Dd -i - > ~/key && git-crypt unlock ~/key
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
      - run: npm run build
      - run: npm test
      - run: npx cap sync ios
      - uses: stefanzweifel/git-auto-commit-action@v5
      # - run: npx cap build ios
      - name: Build project
        run: xcodebuild -workspace './ios/App/App.xcworkspace' -scheme TouhouFest -destination generic/platform=iOS -archivePath App.xcarchive archive

      - name: 🍻 Assemble IPA
        run: xcodebuild archive -archivePath App.xcarchive -exportArchive -exportOptionsPlist ./archive.plist -exportPath output -allowProvisioningUpdates

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-ios
          path: output/
          retention-days: 60

      - name: 'Upload app to TestFlight'
        uses: apple-actions/upload-testflight-build@v3
        with: 
          app-path: './output/TouhouFest.ipa' 
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
       
